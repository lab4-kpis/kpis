project_id = "lab4-kpis"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
enable_signup = true

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_restrict_admin_signup"

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"

# Overrides aplicados por `supabase config push --project-ref <ref>`.
[remotes.development]
project_id = "gapkrqfdshqbowdtldzc"

[remotes.development.auth]
site_url = "https://lab4-kpis.github.io/kpis/dev/"
additional_redirect_urls = ["http://localhost:5173", "https://lab4-kpis.github.io/kpis/dev/", "http://127.0.0.1:47819/callback"]

# OAuth discovery is enabled for the development compatibility test only.
# Pending deployment: the hash route serves the consent UI from the Pages root.
# Do not push this path before deploying the UI; the live path is /oauth/consent.
[remotes.development.auth.oauth_server]
enabled = true
authorization_url_path = "/#/oauth/consent"
allow_dynamic_registration = false

[remotes.production]
project_id = "rzlalzowistpiphmdqpp"

[remotes.production.auth]
site_url = "https://lab4-kpis.github.io/kpis/"
additional_redirect_urls = ["http://localhost:5173", "https://lab4-kpis.github.io/kpis/"]
