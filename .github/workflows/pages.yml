name: Deploy portal to GitHub Pages

# Un solo sitio de Pages sirve ambos entornos:
#   main -> https://lab4-kpis.github.io/kpis/      (Supabase producción)
#   dev  -> https://lab4-kpis.github.io/kpis/dev/  (Supabase desarrollo)
# Cada push reconstruye las dos ramas porque Pages reemplaza el sitio completo.

on:
  push:
    branches: [main, dev]
    # The MCP package is published by its own workflow (mcp-publish.yml).
    paths-ignore:
      - "mcp/**"
      - "plugins/**"
      - ".claude-plugin/**"
      - ".agents/**"
      - ".github/workflows/mcp-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: production
            ref: main
            base: /kpis/
            supabase_url: https://rzlalzowistpiphmdqpp.supabase.co
            publishable_key: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
            mcp_oauth_pilot_ready: "false"
          - name: development
            ref: dev
            base: /kpis/dev/
            supabase_url: ${{ vars.DEV_VITE_SUPABASE_URL }}
            publishable_key: ${{ vars.DEV_VITE_SUPABASE_PUBLISHABLE_KEY }}
            mcp_oauth_pilot_ready: ${{ vars.DEV_VITE_MCP_OAUTH_PILOT_READY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: npm run lint && npm run typecheck
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ matrix.base }}
          VITE_SUPABASE_URL: ${{ matrix.supabase_url }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ matrix.publishable_key }}
          VITE_MCP_OAUTH_PILOT_READY: ${{ matrix.mcp_oauth_pilot_ready }}
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: dist

  deploy:
    needs: build
    # Producción se publica aunque falle el build de desarrollo.
    if: ${{ !cancelled() }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download production build
        uses: actions/download-artifact@v5
        with:
          name: build-production
          path: site
      - name: Download development build
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: build-development
          path: site/dev
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
